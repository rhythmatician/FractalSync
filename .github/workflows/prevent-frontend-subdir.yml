name: Prevent accidental frontend/frontend

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  prevent_frontend_subdir:
    runs-on: ubuntu-latest
    name: Fail if frontend/frontend exists
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for accidental frontend/frontend
        run: |
          if [ -d "frontend/frontend" ]; then
            echo "\nERROR: Unexpected folder 'frontend/frontend' found.\n" >&2
            echo "This repository rejects accidental nested 'frontend/frontend' folders.\n" >&2
            echo "Please remove it and move files to the correct location.\n" >&2
            ls -la frontend || true
            exit 1
          fi
          echo "No accidental frontend/frontend directory found."