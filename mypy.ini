[mypy]
python_version = 3.13
mypy_path = backend:backend/stubs:backend/src:runtime-core:scripts
# NOTE on local vs CI mypy asymmetry: vendored third-party stubs
# (backend/stubs/cv2.pyi, librosa.pyi, glfw.pyi, plus cv2/, librosa/,
# glfw/ subtrees) live under backend/stubs/ which is gitignored. CI never
# sees them, so CI's mypy view is the "real" one. The CI mypy-check
# workflow is the source of truth for "is mypy clean?" — local mypy
# may show extra diagnostics on song_analyzer / live_controller that
# don't reproduce in CI because they go through the local vendored
# stubs. Do NOT try to silence them here; fix any real issue at its
# source instead.
